<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Family Pool</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #3B6D11; --green-light: #EAF3DE; --green-dark: #27500A;
  --blue: #185FA5; --blue-light: #E6F1FB;
  --purple: #534AB7; --purple-light: #EEEDFE;
  --amber: #BA7517; --amber-light: #FAEEDA;
  --coral: #993C1D; --coral-light: #FAECE7;
  --pink: #72243E; --pink-light: #FBEAF0;
  --gray: #5F5E5A; --gray-light: #F1EFE8;
  --border: #e2e2e2; --bg: #f7f7f5; --bg-card: #ffffff;
  --text: #1a1a18; --text-muted: #6b6b67; --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --border: #2e2e2c; --bg: #1a1a18; --bg-card: #242422;
    --text: #f0f0ec; --text-muted: #9a9a94;
    --green-light: #1a3608; --green-dark: #C0DD97;
    --blue-light: #0C447C; --purple-light: #3C3489;
    --amber-light: #412402; --coral-light: #4A1B0C;
    --pink-light: #4B1528; --gray-light: #2C2C2A;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
header { margin-bottom: 20px; }
header h1 { font-size: 22px; font-weight: 600; }
header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.prizes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.prize-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
.prize-1 { background: #FAEEDA; color: #633806; }
.prize-2 { background: var(--gray-light); color: #444441; }
.prize-3 { background: var(--coral-light); color: var(--coral); }
.sync-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 10px; flex-wrap: wrap; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
.sync-dot.ok { background: #639922; }
.sync-dot.loading { background: #BA7517; animation: pulse 1s infinite; }
.sync-dot.err { background: #E24B4A; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab { font-size: 14px; padding: 8px 16px; background: none; border: none; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; white-space: nowrap; }
.tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }
.mode-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; width: fit-content; }
.mode-btn { font-size: 13px; padding: 7px 16px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-family: inherit; }
.mode-btn.active { background: var(--text); color: var(--bg); font-weight: 500; }
.leaderboard { display: flex; flex-direction: column; gap: 8px; }
.lb-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.lb-row.first  { border: 2px solid #EF9F27; }
.lb-row.second { border: 2px solid #aaaaaa; }
.lb-row.third  { border: 2px solid #cd7f32; }
.lb-row.eliminated { opacity: .5; }
.lb-main { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.lb-pos { font-size: 16px; font-weight: 600; width: 32px; text-align: center; flex-shrink: 0; color: var(--text-muted); }
.lb-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.lb-info { flex: 1; min-width: 0; }
.lb-name { font-size: 15px; font-weight: 500; }
.lb-picks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.pick { font-size: 11px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; cursor: pointer; }
.pick:hover { opacity: .8; }
.s-group { background: var(--green-light); color: var(--green-dark); }
.s-elim  { background: var(--gray-light); color: var(--gray); text-decoration: line-through; opacity: .65; }
.s-r32   { background: #dbeafe; color: #1e40af; }
.s-r16   { background: var(--blue-light); color: var(--blue); }
.s-qf    { background: var(--purple-light); color: var(--purple); }
.s-sf    { background: var(--amber-light); color: var(--amber); }
.s-final { background: var(--pink-light); color: var(--pink); }
.s-won   { background: var(--green-light); color: var(--green); font-weight: 600; }
.lb-score { text-align: right; flex-shrink: 0; min-width: 64px; }
.score-n { font-size: 24px; font-weight: 600; }
.score-sub { font-size: 11px; color: var(--text-muted); }
.team-stats-panel { border-top: 1px solid var(--border); padding: 10px 16px; background: var(--bg); display: none; flex-direction: column; gap: 6px; }
.team-stats-panel.open { display: flex; }
.ts-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.ts-flag { width: 22px; text-align: center; font-size: 16px; flex-shrink: 0; }
.ts-name { flex: 1; font-weight: 500; color: var(--text); }
.ts-record { display: flex; gap: 4px; flex-shrink: 0; }
.ts-pill { font-size: 11px; padding: 1px 7px; border-radius: 8px; font-weight: 500; }
.ts-w { background: var(--green-light); color: var(--green-dark); }
.ts-d { background: var(--amber-light); color: var(--amber); }
.ts-l { background: var(--coral-light); color: var(--coral); }
.ts-left { background: var(--gray-light); color: var(--gray); }
.ts-status { font-size: 11px; padding: 1px 8px; border-radius: 8px; }
.ts-safe   { background: var(--green-light); color: var(--green-dark); }
.ts-danger { background: var(--coral-light); color: var(--coral); }
.ts-out    { background: var(--gray-light); color: var(--gray); text-decoration: line-through; }
.ts-ko     { background: var(--purple-light); color: var(--purple); }
.expand-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.info-banner { border-radius: var(--radius); padding: 12px 16px; font-size: 13px; margin-bottom: 16px; line-height: 1.6; border: 1px solid; }
.info-banner.amber { background: var(--amber-light); border-color: #EF9F27; color: var(--amber); }
.info-banner.green { background: var(--green-light); border-color: #639922; color: var(--green); }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 6px; }
.team-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.team-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.team-row:last-child { border-bottom: none; }
.t-flag { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.t-name { flex: 1; font-size: 13px; }
.t-owner { font-size: 11px; }
.t-record { font-size: 11px; color: var(--text-muted); display: flex; gap: 4px; }
.t-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.btn { font-size: 14px; padding: 9px 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--text); color: var(--bg); cursor: pointer; font-family: inherit; font-weight: 500; }
.btn:hover { opacity: .85; }
.btn-outline { background: var(--bg-card); color: var(--text); }
.scoring-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
.scoring-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
.scoring-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
.scoring-card td { padding: 6px 0; border-bottom: 1px solid var(--border); }
.scoring-card tr:last-child td { border-bottom: none; }
.scoring-card td:last-child { text-align: right; font-weight: 500; }
.note { font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; }
.divider { height: 1px; background: var(--border); margin: 20px 0; }
@media(max-width:520px) {
  .lb-main { flex-wrap: wrap; }
  .lb-score { width: 100%; text-align: left; display: flex; align-items: baseline; gap: 8px; padding-top: 4px; }
  .mode-toggle { width: 100%; }
  .mode-btn { flex: 1; text-align: center; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚽ World Cup 2026 — Family Pool</h1>
    <p>June 11 – July 19 &nbsp;·&nbsp; 10 players &nbsp;·&nbsp; 49 picks &nbsp;·&nbsp; $2/team entry</p>
    <div class="prizes">
      <span class="prize-badge prize-1">🥇 1st — $50</span>
      <span class="prize-badge prize-2">🥈 2nd — $30</span>
      <span class="prize-badge prize-3">🥉 3rd — $16</span>
    </div>
    <div class="sync-bar">
      <div class="sync-dot loading" id="syncDot"></div>
      <span id="syncMsg">Loading live scores…</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('leaderboard',this)">Leaderboard</button>
    <button class="tab" onclick="showTab('teams',this)">All teams</button>
    <button class="tab" onclick="showTab('scoring',this)">Scoring</button>
  </div>

  <div id="tab-leaderboard"></div>
  <div id="tab-teams" style="display:none"></div>
  <div id="tab-scoring" style="display:none"></div>
</div>

<script>
const PROXY = "https://worldcup-proxy.glumgold86.workers.dev";

const PEOPLE = [
  {name:"Steve",    color:"#185FA5", bg:"#dbeafe", note:""},
  {name:"AG",       color:"#0F6E56", bg:"#d1fae5", note:"👵 Nana"},
  {name:"Bob",      color:"#993C1D", bg:"#fee2d5", note:""},
  {name:"Gretchen", color:"#534AB7", bg:"#ede9fe", note:""},
  {name:"Simon",    color:"#854F0B", bg:"#fef3c7", note:""},
  {name:"Juliet",   color:"#993556", bg:"#fce7f3", note:""},
  {name:"River",    color:"#3B6D11", bg:"#dcfce7", note:""},
  {name:"Scott",    color:"#5F5E5A", bg:"#f3f4f6", note:""},
  {name:"Alden",    color:"#0C447C", bg:"#dbeafe", note:""},
  {name:"Michael",  color:"#712B13", bg:"#fee2d5", note:""},
];

const DRAFT = [
  {person:"Steve",    teams:["South Korea","Tunisia","Haiti","Norway"]},
  {person:"AG",       teams:["Uzbekistan","Algeria","Colombia","Portugal"]},
  {person:"Bob",      teams:["Qatar","Senegal","Ecuador","Spain","Croatia"]},
  {person:"Gretchen", teams:["Iraq","Ghana","Mexico","Scotland","Belgium"]},
  {person:"Simon",    teams:["Japan","South Africa","Argentina","Germany","Uruguay"]},
  {person:"Juliet",   teams:["Iran","DR Congo","Canada","Switzerland","Paraguay"]},
  {person:"River",    teams:["Jordan","Egypt","Brazil","Turkey","Bosnia and Herzegovina"]},
  {person:"Scott",    teams:["Australia","Ivory Coast","United States","Netherlands","Czech Republic"]},
  {person:"Alden",    teams:["New Zealand","Morocco","Curacao","Sweden","England"]},
  {person:"Michael",  teams:["Saudi Arabia","Cape Verde","Panama","France","Austria"]},
];

const ALL_TEAMS = [];
DRAFT.forEach(d => d.teams.forEach(t => ALL_TEAMS.push({team:t, person:d.person})));

const FLAGS = {
  "South Korea":"🇰🇷","Tunisia":"🇹🇳","Haiti":"🇭🇹","Norway":"🇳🇴",
  "Uzbekistan":"🇺🇿","Algeria":"🇩🇿","Colombia":"🇨🇴","Portugal":"🇵🇹",
  "Qatar":"🇶🇦","Senegal":"🇸🇳","Ecuador":"🇪🇨","Spain":"🇪🇸","Croatia":"🇭🇷",
  "Iraq":"🇮🇶","Ghana":"🇬🇭","Mexico":"🇲🇽","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Belgium":"🇧🇪",
  "Japan":"🇯🇵","South Africa":"🇿🇦","Argentina":"🇦🇷","Germany":"🇩🇪","Uruguay":"🇺🇾",
  "Iran":"🇮🇷","DR Congo":"🇨🇩","Canada":"🇨🇦","Switzerland":"🇨🇭","Paraguay":"🇵🇾",
  "Jordan":"🇯🇴","Egypt":"🇪🇬","Brazil":"🇧🇷","Turkey":"🇹🇷","Bosnia and Herzegovina":"🇧🇦",
  "Australia":"🇦🇺","Ivory Coast":"🇨🇮","United States":"🇺🇸","Netherlands":"🇳🇱","Czech Republic":"🇨🇿",
  "New Zealand":"🇳🇿","Morocco":"🇲🇦","Curacao":"🇨🇼","Sweden":"🇸🇪","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿",
  "Saudi Arabia":"🇸🇦","Cape Verde":"🇨🇻","Panama":"🇵🇦","France":"🇫🇷","Austria":"🇦🇹",
};

const NAME_MAP = {
  "Korea Republic":"South Korea","Democratic Republic of Congo":"DR Congo",
  "Congo DR":"DR Congo","USA":"United States","Côte d'Ivoire":"Ivory Coast",
  "Curaçao":"Curacao","Czechia":"Czech Republic",
};
function norm(n) { return NAME_MAP[n] || n; }

const STATUSES = [
  {key:"group", label:"Group stage",  pts:0},
  {key:"elim",  label:"Eliminated",   pts:0},
  {key:"r32",   label:"Round of 32",  pts:1},
  {key:"r16",   label:"Round of 16",  pts:2},
  {key:"qf",    label:"Quarterfinal", pts:4},
  {key:"sf",    label:"Semifinal",    pts:8},
  {key:"final", label:"Final",        pts:12},
  {key:"won",   label:"Champion 🏆",  pts:20},
];
const STAGE_ORDER = ["group","elim","r32","r16","qf","sf","final","won"];
const POINTS = Object.fromEntries(STATUSES.map(s=>[s.key,s.pts]));
const API_STAGE_MAP = {
  "GROUP_STAGE":"group","ROUND_OF_32":"r32","ROUND_OF_16":"r16",
  "QUARTER_FINALS":"qf","SEMI_FINALS":"sf","FINAL":"final",
};

let teamStatus = {};
let teamRecord = {}; // W/D/L/played/remaining per team
ALL_TEAMS.forEach(t => {
  teamStatus[t.team] = "group";
  teamRecord[t.team] = {w:0, d:0, l:0, played:0, remaining:3, groupDone:false};
});

let scoreMode = "last";
let lastUpdated = null;
let isLoading = false;
let expandedRows = new Set();

function setSyncState(state, msg) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncMsg");
  if (dot) dot.className = "sync-dot " + state;
  if (txt) txt.textContent = msg;
}

async function fetchScores() {
  if (isLoading) return;
  isLoading = true;
  setSyncState("loading", "Updating scores…");
  try {
    const r = await fetch(`${PROXY}/?endpoint=competitions/WC/matches`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    if (!data.matches) throw new Error("No matches in response");
    processMatches(data.matches);
    lastUpdated = new Date();
    setSyncState("ok", "Live · updated " + lastUpdated.toLocaleTimeString());
  } catch(e) {
    setSyncState("err", "Could not load — " + e.message);
  }
  isLoading = false;
  renderAll();
}

function processMatches(matches) {
  // Reset records
  ALL_TEAMS.forEach(t => {
    teamRecord[t.team] = {w:0, d:0, l:0, played:0, remaining:3, groupDone:false};
  });

  const teamBest = {};
  const knockoutTeams = new Set();

  // Count group stage W/D/L and track played/remaining
  const groupMatches = matches.filter(m => m.stage === "GROUP_STAGE");
  const groupDone = groupMatches.length > 0 && groupMatches.every(m => m.status === "FINISHED");

  groupMatches.forEach(m => {
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");
    if (!home || !away) return;

    // Count scheduled/live/finished per team
    const isFinished = m.status === "FINISHED";
    const isScheduled = m.status === "SCHEDULED" || m.status === "TIMED";

    if (teamRecord[home]) {
      if (isFinished) {
        teamRecord[home].played++;
        teamRecord[home].remaining = Math.max(0, 3 - teamRecord[home].played);
      }
    }
    if (teamRecord[away]) {
      if (isFinished) {
        teamRecord[away].played++;
        teamRecord[away].remaining = Math.max(0, 3 - teamRecord[away].played);
      }
    }

    if (!isFinished) return;

    const hs = m.score?.fullTime?.home ?? m.score?.fullTime?.homeTeam;
    const as2 = m.score?.fullTime?.away ?? m.score?.fullTime?.awayTeam;
    if (hs == null || as2 == null) return;

    if (teamRecord[home]) {
      if (hs > as2) teamRecord[home].w++;
      else if (hs === as2) teamRecord[home].d++;
      else teamRecord[home].l++;
      teamRecord[home].groupDone = groupDone;
    }
    if (teamRecord[away]) {
      if (as2 > hs) teamRecord[away].w++;
      else if (hs === as2) teamRecord[away].d++;
      else teamRecord[away].l++;
      teamRecord[away].groupDone = groupDone;
    }
  });

  // Process knockout stages for advancement
  function promote(name, stageKey) {
    if (!name) return;
    const cur = teamBest[name] || "group";
    if (STAGE_ORDER.indexOf(stageKey) > STAGE_ORDER.indexOf(cur)) teamBest[name] = stageKey;
  }

  matches.forEach(m => {
    if (m.status !== "FINISHED") return;
    const stageKey = API_STAGE_MAP[m.stage];
    if (!stageKey) return;
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");

    if (m.stage === "GROUP_STAGE") {
      promote(home, "group");
      promote(away, "group");
    } else {
      promote(home, stageKey);
      promote(away, stageKey);
      knockoutTeams.add(home);
      knockoutTeams.add(away);

      const hs = m.score?.fullTime?.home ?? m.score?.fullTime?.homeTeam;
      const as2 = m.score?.fullTime?.away ?? m.score?.fullTime?.awayTeam;
      let loser = null, winner = null;
      if (hs != null && as2 != null) {
        if (hs > as2) { winner = home; loser = away; }
        else if (as2 > hs) { winner = away; loser = home; }
        else {
          const hp = m.score?.penalties?.home ?? m.score?.penalties?.homeTeam;
          const ap = m.score?.penalties?.away ?? m.score?.penalties?.awayTeam;
          if (hp != null && ap != null) {
            winner = hp > ap ? home : away;
            loser = hp > ap ? away : home;
          }
        }
      }
      if (loser) {
        const cur = teamBest[loser] || "group";
        if (STAGE_ORDER.indexOf(cur) <= STAGE_ORDER.indexOf(stageKey)) teamBest[loser] = "elim";
      }
      if (m.stage === "FINAL" && winner) teamBest[winner] = "won";
    }
  });

  // Mark group losers eliminated if knockouts started
  if (groupDone || knockoutTeams.size > 0) {
    ALL_TEAMS.forEach(t => {
      if (!knockoutTeams.has(t.team) && !teamBest[t.team]) teamBest[t.team] = "elim";
    });
  }

  ALL_TEAMS.forEach(t => {
    if (teamBest[t.team]) teamStatus[t.team] = teamBest[t.team];
  });
}

function getGroupStatus(team) {
  const s = teamStatus[team];
  const rec = teamRecord[team];
  if (!rec) return null;

  // Already in knockouts or eliminated
  if (["r32","r16","qf","sf","final","won"].includes(s)) return {label:"Advanced", cls:"ts-ko"};
  if (s === "elim") return {label:"Eliminated", cls:"ts-out"};

  // Still in group stage
  const {w, d, l, played, remaining, groupDone} = rec;
  if (groupDone && s === "group") return {label:"Eliminated", cls:"ts-out"};
  if (played === 0 && remaining === 3) return {label:"Not played yet", cls:"ts-left"};

  const pts = w * 3 + d;
  // Simple heuristic: 6+ points = likely safe, 0 pts with 1 game left = danger
  let statusLabel = "", statusCls = "";
  if (pts >= 6) { statusLabel = "Likely through"; statusCls = "ts-safe"; }
  else if (pts >= 4) { statusLabel = "In contention"; statusCls = "ts-safe"; }
  else if (remaining === 0 && pts < 3) { statusLabel = "At risk"; statusCls = "ts-danger"; }
  else if (pts === 0 && remaining <= 1) { statusLabel = "In danger"; statusCls = "ts-danger"; }
  else { statusLabel = remaining > 0 ? `${remaining} game${remaining!==1?'s':''} left` : "Waiting"; statusCls = "ts-left"; }

  return {label: statusLabel, cls: statusCls};
}

function sCls(s) {
  return {group:"s-group",elim:"s-elim",r32:"s-r32",r16:"s-r16",qf:"s-qf",sf:"s-sf",final:"s-final",won:"s-won"}[s]||"s-group";
}
function sLabel(s) { return (STATUSES.find(x=>x.key===s)||STATUSES[0]).label; }
function initials(n) { return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }

function bestStage(teams) {
  let best = "elim";
  teams.forEach(t => {
    const ts = teamStatus[t.team]||"group";
    if (STAGE_ORDER.indexOf(ts) > STAGE_ORDER.indexOf(best)) best = ts;
  });
  return best;
}

function calcPoints() {
  return PEOPLE.map(p => {
    const myTeams = ALL_TEAMS.filter(t => t.person === p.name);
    const pts = myTeams.reduce((s,t) => s+(POINTS[teamStatus[t.team]]||0), 0);
    const alive = myTeams.filter(t => teamStatus[t.team] !== "elim").length;
    return {...p, pts, alive, myTeams, sortKey: pts*1000+alive};
  }).sort((a,b) => b.sortKey - a.sortKey);
}

function calcLast() {
  return PEOPLE.map(p => {
    const myTeams = ALL_TEAMS.filter(t => t.person === p.name);
    const alive = myTeams.filter(t => teamStatus[t.team] !== "elim").length;
    const best = bestStage(myTeams);
    const bestIdx = STAGE_ORDER.indexOf(best);
    const isOut = alive === 0;
    return {...p, alive, best, bestIdx, isOut, myTeams, sortKey: isOut ? -1 : bestIdx*100+alive};
  }).sort((a,b) => b.sortKey - a.sortKey);
}

function toggleExpand(name) {
  if (expandedRows.has(name)) expandedRows.delete(name);
  else expandedRows.add(name);
  renderLeaderboard();
}

function renderTeamStatsPanel(myTeams) {
  let h = "";
  myTeams.forEach(t => {
    const s = teamStatus[t.team] || "group";
    const rec = teamRecord[t.team] || {w:0,d:0,l:0,played:0,remaining:3};
    const gs = getGroupStatus(t.team);
    const inGroup = ["group","elim"].includes(s) && !["r32","r16","qf","sf","final","won"].includes(s);

    h += `<div class="ts-row">
      <div class="ts-flag">${FLAGS[t.team]||"🏳"}</div>
      <div class="ts-name">${t.team}</div>`;

    if (inGroup && rec.played > 0) {
      h += `<div class="ts-record">
        <span class="ts-pill ts-w">${rec.w}W</span>
        <span class="ts-pill ts-d">${rec.d}D</span>
        <span class="ts-pill ts-l">${rec.l}L</span>
        ${rec.remaining > 0 ? `<span class="ts-pill ts-left">${rec.remaining} left</span>` : ''}
      </div>`;
    } else if (inGroup && rec.played === 0) {
      h += `<span class="ts-pill ts-left">Not played</span>`;
    } else {
      h += `<span class="ts-pill ${sCls(s)}">${sLabel(s)}</span>`;
    }

    if (gs) h += `<span class="ts-status ${gs.cls}">${gs.label}</span>`;

    h += `</div>`;
  });
  return h;
}

function renderLeaderboard() {
  const isPoints = scoreMode === "points";
  const scores = isPoints ? calcPoints() : calcLast();
  const allZero = scores.every(s => isPoints ? s.pts === 0 : false);

  let h = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px">
    <div class="mode-toggle" style="margin-bottom:0">
      <button class="mode-btn ${isPoints?'active':''}" onclick="setMode('points')">Points</button>
      <button class="mode-btn ${!isPoints?'active':''}" onclick="setMode('last')">Last standing</button>
    </div>
    <button class="btn btn-outline" style="font-size:12px;padding:5px 14px" onclick="fetchScores()">↻ Refresh</button>
  </div>`;

  if (allZero) {
    h += `<div class="info-banner green">Tournament just kicked off! Scores appear once the group stage ends and teams advance to knockouts. Tap any row to see your teams' group stage records.</div>`;
  }
  if (!isPoints) {
    h += `<div class="info-banner amber"><strong>Last standing</strong> — whoever still has a team alive wins. Tiebreaker: furthest stage, then most alive. Tap any row to see your teams' records.</div>`;
  }

  h += `<div class="leaderboard">`;
  let pos = 0, prevKey = null;
  scores.forEach((p, i) => {
    if (p.sortKey !== prevKey) pos = i + 1;
    prevKey = p.sortKey;
    let posLabel = pos, rowClass = "";
    if (!isPoints && p.isOut) { posLabel = "❌"; rowClass = "eliminated"; }
    else if (!allZero && pos === 1) { rowClass = "first";  posLabel = "🥇"; }
    else if (!allZero && pos === 2) { rowClass = "second"; posLabel = "🥈"; }
    else if (!allZero && pos === 3) { rowClass = "third";  posLabel = "🥉"; }

    const picks = p.myTeams.map(t => {
      const s = teamStatus[t.team]||"group";
      return `<span class="pick ${sCls(s)}">${FLAGS[t.team]||""} ${t.team}</span>`;
    }).join("");
    const nameExtra = p.note ? ` <span style="font-size:12px;color:var(--text-muted)">${p.note}</span>` : "";
    let scoreHtml = isPoints
      ? `<div class="score-n">${p.pts}</div><div class="score-sub">pts · ${p.alive} alive</div>`
      : p.isOut
        ? `<div class="score-n" style="font-size:14px;color:var(--text-muted)">Out</div><div class="score-sub">all eliminated</div>`
        : `<div class="score-n">${p.alive}</div><div class="score-sub">team${p.alive!==1?'s':''} alive</div>`;

    const isExpanded = expandedRows.has(p.name);
    const statsHtml = renderTeamStatsPanel(p.myTeams);

    h += `<div class="lb-row ${rowClass}">
      <div class="lb-main" onclick="toggleExpand('${p.name}')" style="cursor:pointer">
        <div class="lb-pos">${posLabel}</div>
        <div class="lb-avatar" style="background:${p.bg};color:${p.color}">${initials(p.name)}</div>
        <div class="lb-info">
          <div class="lb-name">${p.name}${nameExtra}</div>
          <div class="lb-picks">${picks}</div>
          <div class="expand-hint">${isExpanded ? '▲ hide details' : '▼ show team details'}</div>
        </div>
        <div class="lb-score">${scoreHtml}</div>
      </div>
      <div class="team-stats-panel ${isExpanded?'open':''}">${statsHtml}</div>
    </div>`;
  });
  h += `</div>`;
  document.getElementById("tab-leaderboard").innerHTML = h;
}

function renderTeams() {
  const CONFS = [
    {label:"AFC / OFC", teams:["South Korea","Uzbekistan","Qatar","Iraq","Japan","Iran","Jordan","Australia","New Zealand","Saudi Arabia"]},
    {label:"CAF", teams:["Tunisia","Algeria","Senegal","Ghana","South Africa","DR Congo","Egypt","Ivory Coast","Morocco","Cape Verde"]},
    {label:"CONCACAF / CONMEBOL", teams:["Haiti","Colombia","Ecuador","Mexico","Argentina","Canada","Brazil","United States","Curacao","Panama"]},
    {label:"UEFA", teams:["Norway","Portugal","Spain","Scotland","Germany","Switzerland","Turkey","Netherlands","Sweden","France"]},
    {label:"CONMEBOL / UEFA (5th pick)", teams:["Croatia","Belgium","Uruguay","Paraguay","Bosnia and Herzegovina","Czech Republic","England","Austria"]},
  ];
  let h = "";
  CONFS.forEach(conf => {
    h += `<div class="section-title">${conf.label}</div><div class="team-list">`;
    conf.teams.forEach(team => {
      const owner = ALL_TEAMS.find(t=>t.team===team)?.person||"";
      const p = PEOPLE.find(x=>x.name===owner);
      const s = teamStatus[team]||"group";
      const rec = teamRecord[team]||{w:0,d:0,l:0,played:0,remaining:3};
      const gs = getGroupStatus(team);
      const inGroup = ["group"].includes(s);
      h += `<div class="team-row">
        <div class="t-flag">${FLAGS[team]||"🏳"}</div>
        <div class="t-name">${team}<br><span class="t-owner" style="color:${p?p.color:"var(--text-muted)"}">${owner}${p&&p.note?' · '+p.note:''}</span></div>
        ${inGroup && rec.played > 0 ? `<div class="t-record">
          <span class="ts-pill ts-w">${rec.w}W</span>
          <span class="ts-pill ts-d">${rec.d}D</span>
          <span class="ts-pill ts-l">${rec.l}L</span>
          ${rec.remaining > 0 ? `<span class="ts-pill ts-left">${rec.remaining} left</span>` : ''}
        </div>` : `<span class="t-status ${sCls(s)}">${sLabel(s)}</span>`}
        ${gs ? `<span class="ts-status ${gs.cls}" style="font-size:11px;padding:2px 8px;border-radius:10px">${gs.label}</span>` : ''}
      </div>`;
    });
    h += `</div>`;
  });
  document.getElementById("tab-teams").innerHTML = h;
}

function renderScoring() {
  document.getElementById("tab-scoring").innerHTML = `
  <div class="scoring-card">
    <h3>Points mode — cumulative</h3>
    <table>
      <tr><td>Group stage / Eliminated</td><td>0 pts</td></tr>
      <tr><td>Round of 32 <span style="font-size:11px;color:var(--text-muted)">(new in 2026)</span></td><td>+1 pt</td></tr>
      <tr><td>Round of 16</td><td>+2 pts</td></tr>
      <tr><td>Quarterfinal</td><td>+4 pts</td></tr>
      <tr><td>Semifinal</td><td>+8 pts</td></tr>
      <tr><td>Final</td><td>+12 pts</td></tr>
      <tr><td>Champion 🏆</td><td>+20 pts</td></tr>
    </table>
    <p class="note">Points are cumulative — a SF run earns 15 pts total (1+2+4+8). Your score = sum across all your teams.</p>
  </div>
  <div class="divider"></div>
  <div class="scoring-card">
    <h3>Last standing mode — survival</h3>
    <table>
      <tr><td>At least one team alive</td><td>Still in</td></tr>
      <tr><td>All teams eliminated</td><td>Out ❌</td></tr>
      <tr><td>Tiebreaker 1</td><td>Furthest stage reached</td></tr>
      <tr><td>Tiebreaker 2</td><td>Most teams still alive</td></tr>
    </table>
    <p class="note">Last person with a team still playing wins the prize.</p>
  </div>
  <div class="divider"></div>
  <div class="scoring-card" style="background:var(--amber-light);border-color:#EF9F27">
    <h3 style="color:var(--amber)">Prize breakdown</h3>
    <table>
      <tr><td>1st place</td><td style="color:var(--amber)">$50</td></tr>
      <tr><td>2nd place</td><td style="color:var(--amber)">$30</td></tr>
      <tr><td>3rd place</td><td style="color:var(--amber)">$16</td></tr>
      <tr><td>Entry fee</td><td style="color:var(--amber)">$2 per team</td></tr>
    </table>
    <p class="note" style="color:var(--amber)">Steve and AG picked 4 teams each. Everyone else picked 5. Scores update automatically — no manual entry needed!</p>
  </div>`;
}

function renderAll() { renderLeaderboard(); renderTeams(); renderScoring(); }

function showTab(name, btn) {
  ["leaderboard","teams","scoring"].forEach(t => {
    document.getElementById("tab-"+t).style.display = t===name?"block":"none";
  });
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
}

function setMode(m) { scoreMode = m; renderLeaderboard(); }

window.showTab = showTab;
window.setMode = setMode;
window.fetchScores = fetchScores;
window.toggleExpand = toggleExpand;

renderAll();
fetchScores();
setInterval(fetchScores, 5 * 60 * 1000);
</script>
</body>
</html>
