<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Family Pool</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #3B6D11; --green-light: #EAF3DE; --green-dark: #27500A;
  --blue: #185FA5; --blue-light: #E6F1FB;
  --purple: #534AB7; --purple-light: #EEEDFE;
  --amber: #BA7517; --amber-light: #FAEEDA;
  --coral: #993C1D; --coral-light: #FAECE7;
  --pink: #72243E; --pink-light: #FBEAF0;
  --gray: #5F5E5A; --gray-light: #F1EFE8;
  --border: #e2e2e2; --bg: #f7f7f5; --bg-card: #ffffff;
  --text: #1a1a18; --text-muted: #6b6b67; --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --border: #2e2e2c; --bg: #1a1a18; --bg-card: #242422;
    --text: #f0f0ec; --text-muted: #9a9a94;
    --green-light: #1a3608; --green-dark: #C0DD97;
    --blue-light: #0C447C; --purple-light: #3C3489;
    --amber-light: #412402; --coral-light: #4A1B0C;
    --pink-light: #4B1528; --gray-light: #2C2C2A;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
header { margin-bottom: 20px; }
header h1 { font-size: 22px; font-weight: 600; }
header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.prizes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.prize-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
.prize-1 { background: #FAEEDA; color: #633806; }
.prize-2 { background: var(--gray-light); color: #444441; }
.prize-3 { background: var(--coral-light); color: var(--coral); }
.sync-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 10px; flex-wrap: wrap; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
.sync-dot.ok { background: #639922; }
.sync-dot.loading { background: #BA7517; animation: pulse 1s infinite; }
.sync-dot.err { background: #E24B4A; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes scorePulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.live-banner { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
.live-match { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #1a2e1a; border: 1px solid #2d5a2d; border-radius: var(--radius); flex-wrap: wrap; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; animation: scorePulse .8s infinite; }
.live-teams { flex: 1; font-size: 13px; font-weight: 500; color: #f0f0ec; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.live-score { font-size: 16px; font-weight: 700; color: #4ade80; padding: 0 4px; }
.live-minute { font-size: 11px; color: #86efac; white-space: nowrap; }
.live-pool-tag { font-size: 11px; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
.live-yours { background: #534AB7; color: #CECBF6; }
.live-family { background: #0C447C; color: #B5D4F4; }
.upcoming-banner { margin-top: 10px; }
.upcoming-title { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
.upcoming-list { display: flex; flex-direction: column; gap: 4px; }
.upcoming-match { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
.upcoming-teams { flex: 1; color: var(--text); font-weight: 500; }
.upcoming-time { white-space: nowrap; }
/* Head to head */
.h2h-selectors { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.h2h-select { flex: 1; min-width: 120px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); color: var(--text); font-size: 14px; font-family: inherit; cursor: pointer; }
.h2h-vs { font-size: 13px; font-weight: 600; color: var(--text-muted); flex-shrink: 0; }
.h2h-banner { display: flex; align-items: stretch; gap: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
.h2h-side { flex: 1; padding: 20px 16px; text-align: center; }
.h2h-side.left { border-right: 1px solid var(--border); }
.h2h-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; margin: 0 auto 8px; }
.h2h-pname { font-size: 16px; font-weight: 600; }
.h2h-psub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.h2h-big { font-size: 36px; font-weight: 700; margin-top: 8px; }
.h2h-mid { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 12px; gap: 4px; }
.h2h-mid-score { font-size: 11px; color: var(--text-muted); text-align: center; }
.h2h-result { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
.h2h-win  { background: var(--green-light); color: var(--green-dark); }
.h2h-lose { background: var(--coral-light); color: var(--coral); }
.h2h-draw { background: var(--gray-light); color: var(--gray); }
.h2h-matches { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.h2h-match { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; }
.h2h-match-teams { flex: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.h2h-match-score { font-size: 15px; font-weight: 700; padding: 0 6px; }
.h2h-match-stage { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.h2h-match.left-win { border-left: 3px solid #639922; }
.h2h-match.right-win { border-left: 3px solid var(--coral); }
.h2h-match.draw { border-left: 3px solid var(--text-muted); }
.h2h-match.pending { border-left: 3px solid var(--amber); opacity: .8; }
.h2h-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
.h2h-section-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 16px 0 8px; }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tab { font-size: 14px; padding: 8px 16px; background: none; border: none; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; white-space: nowrap; }
.tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }
.mode-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; width: fit-content; }
.mode-btn { font-size: 13px; padding: 7px 16px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-family: inherit; }
.mode-btn.active { background: var(--text); color: var(--bg); font-weight: 500; }
.leaderboard { display: flex; flex-direction: column; gap: 8px; }
.lb-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.lb-row.first  { border: 2px solid #EF9F27; }
.lb-row.second { border: 2px solid #aaaaaa; }
.lb-row.third  { border: 2px solid #cd7f32; }
.lb-row.eliminated { opacity: .5; }
.lb-main { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.lb-pos { font-size: 16px; font-weight: 600; width: 32px; text-align: center; flex-shrink: 0; color: var(--text-muted); }
.lb-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.lb-info { flex: 1; min-width: 0; }
.lb-name { font-size: 15px; font-weight: 500; }
.lb-picks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.pick { font-size: 11px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; cursor: pointer; }
.pick:hover { opacity: .8; }
.s-group { background: var(--green-light); color: var(--green-dark); }
.s-elim  { background: var(--gray-light); color: var(--gray); text-decoration: line-through; opacity: .65; }
.s-r32   { background: #dbeafe; color: #1e40af; }
.s-r16   { background: var(--blue-light); color: var(--blue); }
.s-qf    { background: var(--purple-light); color: var(--purple); }
.s-sf    { background: var(--amber-light); color: var(--amber); }
.s-final { background: var(--pink-light); color: var(--pink); }
.s-won   { background: var(--green-light); color: var(--green); font-weight: 600; }
.lb-score { text-align: right; flex-shrink: 0; min-width: 64px; }
.score-n { font-size: 24px; font-weight: 600; }
.score-sub { font-size: 11px; color: var(--text-muted); }
.team-stats-panel { border-top: 1px solid var(--border); padding: 10px 16px; background: var(--bg); display: none; flex-direction: column; gap: 6px; }
.team-stats-panel.open { display: flex; }
.ts-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.ts-flag { width: 22px; text-align: center; font-size: 16px; flex-shrink: 0; }
.ts-name { flex: 1; font-weight: 500; color: var(--text); }
.ts-name-out { text-decoration: line-through; opacity: 0.45; }
.ts-record { display: flex; gap: 4px; flex-shrink: 0; }
.ts-pill { font-size: 11px; padding: 1px 7px; border-radius: 8px; font-weight: 500; }
.ts-w { background: var(--green-light); color: var(--green-dark); }
.ts-d { background: var(--amber-light); color: var(--amber); }
.ts-l { background: var(--coral-light); color: var(--coral); }
.ts-left { background: var(--gray-light); color: var(--gray); }
.ts-status { font-size: 11px; padding: 1px 8px; border-radius: 8px; }
.ts-safe   { background: var(--green-light); color: var(--green-dark); }
.ts-danger { background: var(--coral-light); color: var(--coral); }
.ts-out    { background: var(--gray-light); color: var(--gray); text-decoration: line-through; }
.ts-ko     { background: var(--purple-light); color: var(--purple); }
.ts-next-match { font-size: 11px; color: var(--text-muted); padding: 1px 0 4px 30px; }
.expand-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.info-banner { border-radius: var(--radius); padding: 12px 16px; font-size: 13px; margin-bottom: 16px; line-height: 1.6; border: 1px solid; }
.info-banner.amber { background: var(--amber-light); border-color: #EF9F27; color: var(--amber); }
.info-banner.green { background: var(--green-light); border-color: #639922; color: var(--green); }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 6px; }
.team-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.team-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.team-row:last-child { border-bottom: none; }
.t-flag { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.t-name { flex: 1; font-size: 13px; }
.t-owner { font-size: 11px; }
.t-record { font-size: 11px; color: var(--text-muted); display: flex; gap: 4px; }
.t-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.btn { font-size: 14px; padding: 9px 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--text); color: var(--bg); cursor: pointer; font-family: inherit; font-weight: 500; }
.btn:hover { opacity: .85; }
.btn-outline { background: var(--bg-card); color: var(--text); }
.scoring-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
.scoring-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
.scoring-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
.scoring-card td { padding: 6px 0; border-bottom: 1px solid var(--border); }
.scoring-card tr:last-child td { border-bottom: none; }
.scoring-card td:last-child { text-align: right; font-weight: 500; }
.note { font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; }
.divider { height: 1px; background: var(--border); margin: 20px 0; }
@media(max-width:520px) {
  .lb-main { flex-wrap: wrap; }
  .lb-score { width: 100%; text-align: left; display: flex; align-items: baseline; gap: 8px; padding-top: 4px; }
  .mode-toggle { width: 100%; }
  .mode-btn { flex: 1; text-align: center; }
}
/* Live Scores tab */
.ls-section-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 16px 0 8px; display: flex; align-items: center; gap: 6px; }
.ls-matches { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.ls-match { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.ls-match-live { border-color: #2d5a2d; background: #1a2e1a; }
.ls-match-meta { display: flex; align-items: center; justify-content: space-between; padding: 5px 12px; background: rgba(0,0,0,.04); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }
.ls-match-live .ls-match-meta { background: rgba(0,0,0,.15); border-bottom-color: #2d5a2d; }
.ls-live-label { display: flex; align-items: center; gap: 5px; color: #4ade80; font-weight: 600; font-size: 11px; }
.ls-ft-label { color: var(--text-muted); }
.ls-kick-label { color: var(--blue); font-weight: 500; }
.ls-stage-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
.ls-match-live .ls-stage-label { color: #86efac; }
.ls-match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 11px 12px; }
.ls-team-col { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.ls-team-col-away { flex-direction: row-reverse; }
.ls-flag { font-size: 18px; flex-shrink: 0; }
.ls-tname { font-size: 13px; font-weight: 500; white-space: nowrap; }
.ls-match-live .ls-tname { color: #f0f0ec; }
.ls-winner .ls-tname { font-weight: 700; }
.ls-loser .ls-tname { opacity: .55; }
.ls-owner-tag { font-size: 11px; padding: 2px 7px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
.ls-score-col { text-align: center; min-width: 58px; flex-shrink: 0; }
.ls-score { font-size: 20px; font-weight: 700; }
.ls-score-live { color: #4ade80; animation: scorePulse .8s infinite; }
.ls-vs { font-size: 13px; color: var(--text-muted); font-weight: 500; }
.ls-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
/* Group standings */
.gs-legend { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; }
.gs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 8px; }
.gs-group-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
.gs-table { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 11px; border-collapse: separate; border-spacing: 0; }
.gs-table th { padding: 5px 6px; font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--text-muted); background: var(--bg); border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
.gs-table th:nth-child(2) { text-align: left; }
.gs-table td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: right; vertical-align: middle; }
.gs-table tr:last-child td { border-bottom: none; }
.gs-table td:nth-child(2) { text-align: left; }
.gs-pos-cell { color: var(--text-muted); font-size: 11px; text-align: center !important; width: 14px; }
.gs-team-cell { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.gs-tname { font-size: 11px; font-weight: 500; }
.gs-pts { font-weight: 700; }
.gs-qualified { background: rgba(59,109,17,.08); }
.gs-maybe { background: rgba(186,117,23,.07); }
@media(max-width:520px) { .gs-grid { grid-template-columns: 1fr; } }
@media(max-width:480px) {
  .ls-match-row { grid-template-columns: 1fr auto 1fr; gap: 4px; padding: 10px 10px; }
  .ls-tname { font-size: 12px; }
  .ls-score { font-size: 18px; }
  .ls-score-col { min-width: 48px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>

</div>

  "Korea Republic":"South Korea","Democratic Republic of Congo":"DR Congo",
  "Congo DR":"DR Congo","USA":"United States","Côte d'Ivoire":"Ivory Coast",
  "Curaçao":"Curacao","Czechia":"Czech Republic",

  "DR Congo":"DR Congo","Republic of Ireland":"Ireland",
  "Northern Ireland":"Northern Ireland",
  "United States of America":"United States",
};
function norm(n) { return NAME_MAP[n] || n; }
function flag(name) {
  const f = FLAGS[name];
  if (!f) console.warn("[flag missing]", JSON.stringify(name));
  return f || "";
}

const STATUSES = [
  {key:"group", label:"Group stage",  pts:0},
  {key:"elim",  label:"Eliminated",   pts:0},
  {key:"r32",   label:"Round of 32",  pts:1},
  {key:"r16",   label:"Round of 16",  pts:2},
  {key:"qf",    label:"Quarterfinal", pts:4},
  {key:"sf",    label:"Semifinal",    pts:8},
  {key:"final", label:"Final",        pts:12},
  {key:"won",   label:"Champion 🏆",  pts:20},
];
const STAGE_ORDER = ["group","elim","r32","r16","qf","sf","final","won"];
const POINTS = Object.fromEntries(STATUSES.map(s=>[s.key,s.pts]));
const API_STAGE_MAP = {
  "GROUP_STAGE":"group",
  "ROUND_OF_32":"r32","LAST_32":"r32",
  "ROUND_OF_16":"r16","LAST_16":"r16",
  "QUARTER_FINALS":"qf","LAST_8":"qf",
  "SEMI_FINALS":"sf","LAST_4":"sf",
  "FINAL":"final","LAST_2":"final",
};

let teamStatus = {};
let teamRecord = {}; // W/D/L/played/remaining per team
ALL_TEAMS.forEach(t => {
  teamStatus[t.team] = "group";
  teamRecord[t.team] = {w:0, d:0, l:0, played:0, remaining:3, groupDone:false};
});

let scoreMode = "last";
let lastUpdated = null;
let allStandings = [];
let isLoading = false;
let expandedRows = new Set();

function setSyncState(state, msg) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncMsg");
  if (dot) dot.className = "sync-dot " + state;
  if (txt) txt.textContent = msg;
}

async function fetchScores() {
  if (isLoading) return;
  isLoading = true;
  setSyncState("loading", "Updating scores…");
  try {
    const [matchRes, standRes] = await Promise.all([
      fetch(`${PROXY}/?endpoint=competitions/WC/matches`),
      fetch(`${PROXY}/?endpoint=competitions/WC/standings`)
    ]);
    if (!matchRes.ok) throw new Error("HTTP " + matchRes.status);
    const matchData = await matchRes.json();
    if (!matchData.matches) throw new Error("No matches in response");
    allMatches = matchData.matches;
    if (standRes.ok) {
      const standData = await standRes.json();
      allStandings = standData.standings || [];
    }
    processMatches(allMatches);
    processStandings(allStandings);
    renderLiveBanner(allMatches);
    lastUpdated = new Date();
    setSyncState("ok", "Live · updated " + lastUpdated.toLocaleTimeString());
  } catch(e) {
    setSyncState("err", "Could not load — " + e.message);
  }
  isLoading = false;
  renderAll();
}

function processMatches(matches) {
  // Reset records
  ALL_TEAMS.forEach(t => {
    teamRecord[t.team] = {w:0, d:0, l:0, played:0, remaining:3, groupDone:false};
  });

  const teamBest = {};
  const knockoutTeams = new Set();

  // Count group stage W/D/L and track played/remaining
  const groupMatches = matches.filter(m => m.stage === "GROUP_STAGE");
  const groupDone = groupMatches.length > 0 && groupMatches.every(m => m.status === "FINISHED");

  groupMatches.forEach(m => {
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");
    if (!home || !away) return;

    // Count scheduled/live/finished per team
    const isFinished = m.status === "FINISHED";
    const isScheduled = m.status === "SCHEDULED" || m.status === "TIMED";

    if (teamRecord[home]) {
      if (isFinished) {
        teamRecord[home].played++;
        teamRecord[home].remaining = Math.max(0, 3 - teamRecord[home].played);
      }
    }
    if (teamRecord[away]) {
      if (isFinished) {
        teamRecord[away].played++;
        teamRecord[away].remaining = Math.max(0, 3 - teamRecord[away].played);
      }
    }

    if (!isFinished) return;

    const hs = m.score?.fullTime?.home ?? m.score?.fullTime?.homeTeam;
    const as2 = m.score?.fullTime?.away ?? m.score?.fullTime?.awayTeam;
    if (hs == null || as2 == null) return;

    if (teamRecord[home]) {
      if (hs > as2) teamRecord[home].w++;
      else if (hs === as2) teamRecord[home].d++;
      else teamRecord[home].l++;
      teamRecord[home].groupDone = groupDone;
    }
    if (teamRecord[away]) {
      if (as2 > hs) teamRecord[away].w++;
      else if (hs === as2) teamRecord[away].d++;
      else teamRecord[away].l++;
      teamRecord[away].groupDone = groupDone;
    }
  });

  // Build per-group pts/played for mathematical elimination
  const groupData = {};
  groupMatches.forEach(m => {
    const grp = m.group;
    if (!grp) return;
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");
    if (!home || !away) return;
    if (!groupData[grp]) groupData[grp] = {};
    if (!groupData[grp][home]) groupData[grp][home] = {pts:0, p:0, gf:0, ga:0};
    if (!groupData[grp][away]) groupData[grp][away] = {pts:0, p:0, gf:0, ga:0};
    if (m.status !== "FINISHED") return;
    const hs = m.score?.fullTime?.home ?? m.score?.fullTime?.homeTeam;
    const as2 = m.score?.fullTime?.away ?? m.score?.fullTime?.awayTeam;
    if (hs == null || as2 == null) return;
    groupData[grp][home].p++; groupData[grp][away].p++;
    groupData[grp][home].gf += hs; groupData[grp][home].ga += as2;
    groupData[grp][away].gf += as2; groupData[grp][away].ga += hs;
    if (hs > as2) { groupData[grp][home].pts += 3; }
    else if (hs === as2) { groupData[grp][home].pts++; groupData[grp][away].pts++; }
    else { groupData[grp][away].pts += 3; }
  });

  // Process knockout stages for advancement
  function promote(name, stageKey) {
    if (!name) return;
    const cur = teamBest[name] || "group";
    if (STAGE_ORDER.indexOf(stageKey) > STAGE_ORDER.indexOf(cur)) teamBest[name] = stageKey;
  }

  // First pass: scan ALL knockout fixtures (incl. scheduled) — add to knockoutTeams
  // and promote stage so teams in upcoming R32 matches show as "Advanced" not "group"
  matches.forEach(m => {
    const stageKey = API_STAGE_MAP[m.stage];
    if (!stageKey || m.stage === "GROUP_STAGE") return;
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");
    if (home) { knockoutTeams.add(home); promote(home, stageKey); }
    if (away) { knockoutTeams.add(away); promote(away, stageKey); }
  });

  // Second pass: process completed matches for stage promotion and elimination
  const DONE_STATUSES = new Set(["FINISHED","AWARDED","WALKOVER"]);
  matches.forEach(m => {
    if (!DONE_STATUSES.has(m.status)) return;
    const stageKey = API_STAGE_MAP[m.stage];
    if (!stageKey) return;
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");

    if (m.stage === "GROUP_STAGE") {
      promote(home, "group");
      promote(away, "group");
    } else {
      promote(home, stageKey);
      promote(away, stageKey);

      let loser = null, winner = null;
      // score.winner is the most reliable field — set by the API for all completion types
      const sw = m.score?.winner;
      if (sw === "HOME_TEAM") { winner = home; loser = away; }
      else if (sw === "AWAY_TEAM") { winner = away; loser = home; }
      else {
        // Fallback: parse scores — penalties first, then ET (if duration says so), then full time
        const hp = m.score?.penalties?.home ?? m.score?.penalties?.homeTeam;
        const ap = m.score?.penalties?.away ?? m.score?.penalties?.awayTeam;
        if (hp != null && ap != null && hp !== ap) {
          winner = hp > ap ? home : away;
          loser  = hp > ap ? away : home;
        } else {
          // For PENALTY_SHOOTOUT where PEN scores are equal or null, the API encodes the
          // actual penalty tally in fullTime (e.g. FT=5-6 means home scored 5, away 6).
          // Try fullTime first, then extraTime as a final fallback.
          const hs = m.score?.fullTime?.home ?? m.score?.fullTime?.homeTeam;
          const as2 = m.score?.fullTime?.away ?? m.score?.fullTime?.awayTeam;
          if (hs != null && as2 != null && hs !== as2) {
            winner = hs > as2 ? home : away;
            loser  = hs > as2 ? away : home;
          } else {
            const he = m.score?.extraTime?.home ?? m.score?.extraTime?.homeTeam;
            const ae = m.score?.extraTime?.away ?? m.score?.extraTime?.awayTeam;
            if (he != null && ae != null && he !== ae) {
              winner = he > ae ? home : away;
              loser  = he > ae ? away : home;
            }
          }
        }
      }
      if (loser) {
        const cur = teamBest[loser] || "group";
        if (STAGE_ORDER.indexOf(cur) <= STAGE_ORDER.indexOf(stageKey)) teamBest[loser] = "elim";
      }
      if (stageKey === "final" && winner) teamBest[winner] = "won";
    }
  });

  // Mark teams eliminated when 2+ others in their group have more points than their max possible.
  // This catches both 3rd and 4th place in completed groups (beatsUs=2 and 3 respectively).
  // Teams already in a knockout fixture are skipped — they qualified regardless of group position.
  Object.values(groupData).forEach(teams => {
    const list = Object.entries(teams);
    list.forEach(([name, data]) => {
      if (knockoutTeams.has(name)) return;
      const maxPts = data.pts + 3 * Math.max(0, 3 - data.p);
      const beatsUs = list.filter(([n, d]) => n !== name && d.pts > maxPts).length;
      if (beatsUs >= 2 && (!teamBest[name] || teamBest[name] === "group")) {
        teamBest[name] = "elim";
      }
    });
  });

  // Final sweep: once all groups done and R32 populated, catch any remaining non-qualifiers
  if (groupDone && knockoutTeams.size > 0) {
    ALL_TEAMS.forEach(t => {
      if (!knockoutTeams.has(t.team) && (!teamBest[t.team] || teamBest[t.team] === "group")) {
        teamBest[t.team] = "elim";
      }
    });
  }

  ALL_TEAMS.forEach(t => {
    if (teamBest[t.team]) teamStatus[t.team] = teamBest[t.team];
  });
}

function getGroupStatus(team) {
  const s = teamStatus[team];
  const rec = teamRecord[team];
  if (!rec) return null;

  // Already in knockouts or eliminated
  if (["r32","r16","qf","sf","final","won"].includes(s)) return {label:"Advanced", cls:"ts-ko"};
  if (s === "elim") return {label:"Eliminated", cls:"ts-out"};

  // Still in group stage
  const {w, d, l, played, remaining} = rec;
  if (played === 0 && remaining === 3) return {label:"Not played yet", cls:"ts-left"};

  const pts = w * 3 + d;
  // Simple heuristic: 6+ points = likely safe, 0 pts with 1 game left = danger
  let statusLabel = "", statusCls = "";
  if (pts >= 6) { statusLabel = "Likely through"; statusCls = "ts-safe"; }
  else if (pts >= 4) { statusLabel = "In contention"; statusCls = "ts-safe"; }
  else if (remaining === 0 && pts < 3) { statusLabel = "At risk"; statusCls = "ts-danger"; }
  else if (pts === 0 && remaining <= 1) { statusLabel = "In danger"; statusCls = "ts-danger"; }
  else { statusLabel = remaining > 0 ? `${remaining} game${remaining!==1?'s':''} left` : "Waiting"; statusCls = "ts-left"; }

  return {label: statusLabel, cls: statusCls};
}

function nextMatch(teamName) {
  return allMatches
    .filter(m => {
      if (m.status !== "SCHEDULED" && m.status !== "TIMED") return false;
      const hn = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
      const an = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");
      return hn === teamName || an === teamName;
    })
    .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate))[0] || null;
}

function sCls(s) {
  return {group:"s-group",elim:"s-elim",r32:"s-r32",r16:"s-r16",qf:"s-qf",sf:"s-sf",final:"s-final",won:"s-won"}[s]||"s-group";
}
function sLabel(s) { return (STATUSES.find(x=>x.key===s)||STATUSES[0]).label; }
function initials(n) { return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }

function bestStage(teams) {
  let best = "elim";
  teams.forEach(t => {
    const ts = teamStatus[t.team]||"group";
    if (STAGE_ORDER.indexOf(ts) > STAGE_ORDER.indexOf(best)) best = ts;
  });
  return best;
}

function calcPoints() {
  return PEOPLE.map(p => {
    const myTeams = ALL_TEAMS.filter(t => t.person === p.name);
    const pts = myTeams.reduce((s,t) => s+(POINTS[teamStatus[t.team]]||0), 0);
    const alive = myTeams.filter(t => teamStatus[t.team] !== "elim").length;
    return {...p, pts, alive, myTeams, sortKey: pts*1000+alive};
  }).sort((a,b) => b.sortKey - a.sortKey);
}

function calcLast() {
  return PEOPLE.map(p => {
    const myTeams = ALL_TEAMS.filter(t => t.person === p.name);
    const alive = myTeams.filter(t => teamStatus[t.team] !== "elim").length;
    const best = bestStage(myTeams);
    const bestIdx = STAGE_ORDER.indexOf(best);
    const isOut = alive === 0;
    return {...p, alive, best, bestIdx, isOut, myTeams, sortKey: isOut ? -1 : bestIdx*100+alive};
  }).sort((a,b) => b.sortKey - a.sortKey);
}

function toggleExpand(name) {
  if (expandedRows.has(name)) expandedRows.delete(name);
  else expandedRows.add(name);
  renderLeaderboard();
}

function renderTeamStatsPanel(myTeams) {
  let h = "";
  myTeams.forEach(t => {
    const s = teamStatus[t.team] || "group";
    const rec = teamRecord[t.team] || {w:0,d:0,l:0,played:0,remaining:3};
    const isElim = s === "elim";
    const inGroup = !["r32","r16","qf","sf","final","won"].includes(s);

    // Name — crossed out if eliminated
    h += `<div class="ts-row">
      <div class="ts-flag">${FLAGS[t.team]||"🏳"}</div>
      <div class="ts-name${isElim?' ts-name-out':''}">${t.team}</div>`;

    if (!isElim && inGroup && rec.played > 0) {
      h += `<div class="ts-record">
        <span class="ts-pill ts-w">${rec.w}W</span>
        <span class="ts-pill ts-d">${rec.d}D</span>
        <span class="ts-pill ts-l">${rec.l}L</span>
        ${rec.remaining > 0 ? `<span class="ts-pill ts-left">${rec.remaining} left</span>` : ''}
      </div>`;
    } else if (!isElim && inGroup && rec.played === 0) {
      h += `<span class="ts-pill ts-left">Not played</span>`;
    } else if (!isElim) {
      h += `<span class="ts-pill ${sCls(s)}">${sLabel(s)}</span>`;
    }

    h += `</div>`;

    if (isElim) return;

    // Next match line for alive teams
    const nm = nextMatch(t.team);
    if (nm) {
      const hn = norm(nm.homeTeam?.name || nm.homeTeam?.shortName || "");
      const an = norm(nm.awayTeam?.name || nm.awayTeam?.shortName || "");
      const opp = hn === t.team ? an : hn;
      const oppFlag = FLAGS[opp] || "";
      const kickoff = new Date(nm.utcDate);
      const dateStr = kickoff.toLocaleDateString(undefined, {month:"short", day:"numeric"});
      const timeStr = kickoff.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
      const stageStr = nm.stage !== "GROUP_STAGE"
        ? ` · ${nm.stage.replace(/_/g," ").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}`
        : "";
      h += `<div class="ts-next-match">⚽ vs ${oppFlag} ${opp}${stageStr} · ${dateStr} ${timeStr}</div>`;
    }
  });
  return h;
}

function renderLeaderboard() {
  const isPoints = scoreMode === "points";
  const scores = isPoints ? calcPoints() : calcLast();
  const allZero = scores.every(s => isPoints ? s.pts === 0 : false);

  let h = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px">
    <div class="mode-toggle" style="margin-bottom:0">
      <button class="mode-btn ${isPoints?'active':''}" onclick="setMode('points')">Points</button>
      <button class="mode-btn ${!isPoints?'active':''}" onclick="setMode('last')">Last standing</button>
    </div>
    <button class="btn btn-outline" style="font-size:12px;padding:5px 14px" onclick="fetchScores()">↻ Refresh</button>
  </div>`;

  if (allZero) {
    h += `<div class="info-banner green">Tournament just kicked off! Scores appear once the group stage ends and teams advance to knockouts. Tap any row to see your teams' group stage records.</div>`;
  }
  if (!isPoints) {
    h += `<div class="info-banner amber"><strong>Last standing</strong> — whoever still has a team alive wins. Tiebreaker: furthest stage, then most alive. Tap any row to see your teams' records.</div>`;
  }

  h += `<div class="leaderboard">`;
  let pos = 0, prevKey = null;
  scores.forEach((p, i) => {
    if (p.sortKey !== prevKey) pos = i + 1;
    prevKey = p.sortKey;
    let posLabel = pos, rowClass = "";
    if (!isPoints && p.isOut) { posLabel = "❌"; rowClass = "eliminated"; }
    else if (!allZero && pos === 1) { rowClass = "first";  posLabel = "🥇"; }
    else if (!allZero && pos === 2) { rowClass = "second"; posLabel = "🥈"; }
    else if (!allZero && pos === 3) { rowClass = "third";  posLabel = "🥉"; }

    const picks = p.myTeams.map(t => {
      const s = teamStatus[t.team]||"group";
      return `<span class="pick ${sCls(s)}">${FLAGS[t.team]||""} ${t.team}</span>`;
    }).join("");
    const nameExtra = p.note ? ` <span style="font-size:12px;color:var(--text-muted)">${p.note}</span>` : "";
    let scoreHtml = isPoints
      ? `<div class="score-n">${p.pts}</div><div class="score-sub">pts · ${p.alive} alive</div>`
      : p.isOut
        ? `<div class="score-n" style="font-size:14px;color:var(--text-muted)">Out</div><div class="score-sub">all eliminated</div>`
        : `<div class="score-n">${p.alive}</div><div class="score-sub">team${p.alive!==1?'s':''} alive</div>`;

    const isExpanded = expandedRows.has(p.name);
    const statsHtml = renderTeamStatsPanel(p.myTeams);

    h += `<div class="lb-row ${rowClass}">
      <div class="lb-main" onclick="toggleExpand('${p.name}')" style="cursor:pointer">
        <div class="lb-pos">${posLabel}</div>
        <div class="lb-avatar" style="background:${p.bg};color:${p.color}">${initials(p.name)}</div>
        <div class="lb-info">
          <div class="lb-name">${p.name}${nameExtra}</div>
          <div class="lb-picks">${picks}</div>
          <div class="expand-hint">${isExpanded ? '▲ hide details' : '▼ show team details'}</div>
        </div>
        <div class="lb-score">${scoreHtml}</div>
      </div>
      <div class="team-stats-panel ${isExpanded?'open':''}">${statsHtml}</div>
    </div>`;
  });
  h += `</div>`;

  document.getElementById("tab-leaderboard").innerHTML = h;
}

function buildGroupStandings() {
  const groupMatches = allMatches.filter(m => m.stage === "GROUP_STAGE");
  if (!groupMatches.length) return {};
  const groups = {};
  groupMatches.forEach(m => {
    const grp = m.group;
    if (!grp) return;
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");
    if (!home || !away) return;
    if (!groups[grp]) groups[grp] = {};
    [home, away].forEach(t => { if (!groups[grp][t]) groups[grp][t] = {p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; });
    if (m.status !== "FINISHED") return;
    const hs = m.score?.fullTime?.home ?? 0;
    const as2 = m.score?.fullTime?.away ?? 0;
    groups[grp][home].p++; groups[grp][away].p++;
    groups[grp][home].gf += hs; groups[grp][home].ga += as2;
    groups[grp][away].gf += as2; groups[grp][away].ga += hs;
    if (hs > as2) { groups[grp][home].w++; groups[grp][home].pts += 3; groups[grp][away].l++; }
    else if (hs === as2) { groups[grp][home].d++; groups[grp][home].pts++; groups[grp][away].d++; groups[grp][away].pts++; }
    else { groups[grp][away].w++; groups[grp][away].pts += 3; groups[grp][home].l++; }
  });
  return groups;
}

function renderTeams() {
  const CONFS = [
    {label:"AFC / OFC", teams:["South Korea","Uzbekistan","Qatar","Iraq","Japan","Iran","Jordan","Australia","New Zealand","Saudi Arabia"]},

function processStandings(standings) {
  if (!standings || !standings.length) return;
  standings.forEach(group => {
    const table = group.table || [];
    if (!table.length) return;
    const allPlayed = table.every(row => row.playedGames >= 3);
    if (!allPlayed) return;
    table.forEach(row => {
      const name = norm(row.team?.name || row.team?.shortName || "");
      if (!name || !teamStatus[name]) return;
      const cur = teamStatus[name];
      if (["r32","r16","qf","sf","final","won"].includes(cur)) return;
      // only position 4 is definitively eliminated — 3rd place may qualify as best 3rd in 2026
      if (row.position === 4) teamStatus[name] = "elim";
    });
  });
}

function renderLiveScores() {
  const el = document.getElementById("tab-live");
  if (!el) return;
  if (!allMatches.length) {
    el.innerHTML = `<div class="ls-empty">Loading matches…</div>`;
    return;
  }

  const now = new Date();
  const todayStr = now.toDateString();

  const live = allMatches.filter(m => m.status === "IN_PLAY" || m.status === "PAUSED");
  const finished = allMatches
    .filter(m => m.status === "FINISHED")
    .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate))
    .slice(0, 10);
  const allUpcoming = allMatches
    .filter(m => m.status === "SCHEDULED" || m.status === "TIMED")
    .map(m => ({...m, _kickoff: new Date(m.utcDate)}))
    .filter(m => m._kickoff > now)
    .sort((a, b) => a._kickoff - b._kickoff);
  const todayUpcoming = allUpcoming.filter(m => m._kickoff.toDateString() === todayStr);
  const futureUpcoming = allUpcoming.filter(m => m._kickoff.toDateString() !== todayStr).slice(0, 8);

  function stageLabel(stage) {
    if (!stage) return '';
    return stage.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  }

  function ownerTag(teamName) {
    const entry = ALL_TEAMS.find(t => t.team === teamName);
    if (!entry) return '';
    const p = PEOPLE.find(x => x.name === entry.person);
    if (!p) return '';
    return `<span class="ls-owner-tag" style="background:${p.bg};color:${p.color}">${p.name}</span>`;
  }

  function matchCard(m) {
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || '?');
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || '?');
    const isLive = m.status === "IN_PLAY" || m.status === "PAUSED";
    const isFinished = m.status === "FINISHED";

    const hs = m.score?.fullTime?.home ?? m.score?.halfTime?.home ?? 0;
    const as2 = m.score?.fullTime?.away ?? m.score?.halfTime?.away ?? 0;
    const min = m.minute ? m.minute + "'" : (m.status === "PAUSED" ? "HT" : "Live");

    let homeClass = '', awayClass = '';
    if (isFinished) {
      if (hs > as2) { homeClass = 'ls-winner'; awayClass = 'ls-loser'; }
      else if (as2 > hs) { awayClass = 'ls-winner'; homeClass = 'ls-loser'; }
    }

    let metaLeft, scoreHtml;
    if (isLive) {
      metaLeft = `<div class="ls-live-label"><div class="live-dot"></div>${min}</div>`;
      scoreHtml = `<span class="ls-score ls-score-live">${hs} – ${as2}</span>`;
    } else if (isFinished) {
      const d = new Date(m.utcDate).toLocaleDateString([], {month:'short', day:'numeric'});
      metaLeft = `<div class="ls-ft-label">FT · ${d}</div>`;
      scoreHtml = `<span class="ls-score">${hs} – ${as2}</span>`;
    } else {
      const kickoff = m._kickoff || new Date(m.utcDate);
      const timeStr = kickoff.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const dateStr = kickoff.toLocaleDateString([], {month:'short', day:'numeric'});
      metaLeft = `<div class="ls-kick-label">${dateStr} · ${timeStr}</div>`;
      scoreHtml = `<span class="ls-vs">vs</span>`;
    }

    return `<div class="ls-match${isLive ? ' ls-match-live' : ''}">
      <div class="ls-match-meta">
        ${metaLeft}
        <div class="ls-stage-label">${stageLabel(m.stage)}</div>
      </div>
      <div class="ls-match-row">
        <div class="ls-team-col ${homeClass}">
          <span class="ls-flag">${flag(home)}</span>
          <span class="ls-tname">${home}</span>
          ${ownerTag(home)}
        </div>
        <div class="ls-score-col">${scoreHtml}</div>
        <div class="ls-team-col ls-team-col-away ${awayClass}">
          <span class="ls-flag">${flag(away)}</span>
          <span class="ls-tname">${away}</span>
          ${ownerTag(away)}
        </div>
      </div>
    </div>`;
  }

  let h = '';

  if (live.length > 0) {
    h += `<div class="ls-section-title"><div class="live-dot"></div>Live Now</div>`;
    h += `<div class="ls-matches">${live.map(matchCard).join('')}</div>`;
  }

  if (todayUpcoming.length > 0) {
    h += `<div class="ls-section-title">Today's Matches</div>`;
    h += `<div class="ls-matches">${todayUpcoming.map(matchCard).join('')}</div>`;
  }

  if (finished.length > 0) {
    h += `<div class="ls-section-title">Recent Results</div>`;
    h += `<div class="ls-matches">${finished.map(matchCard).join('')}</div>`;
  }

  if (futureUpcoming.length > 0) {
    h += `<div class="ls-section-title">Upcoming</div>`;
    h += `<div class="ls-matches">${futureUpcoming.map(matchCard).join('')}</div>`;
  }

  if (!h) h = `<div class="ls-empty">No matches available.</div>`;

  el.innerHTML = h;
}

let allMatches = [];
let h2hLeft = "Gretchen";
let h2hRight = "Simon";

function renderH2H() {
  const el = document.getElementById("tab-h2h");
  if (!el) return;

  const pLeft  = PEOPLE.find(p => p.name === h2hLeft);
  const pRight = PEOPLE.find(p => p.name === h2hRight);
  if (!pLeft || !pRight) return;

  const leftTeams  = new Set(ALL_TEAMS.filter(t => t.person === h2hLeft).map(t => t.team));
  const rightTeams = new Set(ALL_TEAMS.filter(t => t.person === h2hRight).map(t => t.team));

  // Find all matches between a left team and a right team
  const clashes = [];
  allMatches.forEach(m => {
    const home = norm(m.homeTeam?.name || m.homeTeam?.shortName || "");
    const away = norm(m.awayTeam?.name || m.awayTeam?.shortName || "");
    const homeIsLeft  = leftTeams.has(home),  homeIsRight = rightTeams.has(home);
    const awayIsLeft  = leftTeams.has(away),  awayIsRight = rightTeams.has(away);
    if ((homeIsLeft && awayIsRight) || (homeIsRight && awayIsLeft)) {
      clashes.push({m, home, away, homeIsLeft, homeIsRight});
    }
  });

  // Tally wins
  let leftWins = 0, rightWins = 0, draws = 0;
  clashes.forEach(({m, home, away, homeIsLeft}) => {
    if (m.status !== "FINISHED") return;
    const hs = m.score?.fullTime?.home ?? m.score?.fullTime?.homeTeam;
    const as2 = m.score?.fullTime?.away ?? m.score?.fullTime?.awayTeam;
    if (hs == null || as2 == null) return;
    let winner = null;
    if (hs > as2) winner = "home";
    else if (as2 > hs) winner = "away";
    else {
      const hp = m.score?.penalties?.home ?? m.score?.penalties?.homeTeam;
      const ap = m.score?.penalties?.away ?? m.score?.penalties?.awayTeam;
      if (hp != null && ap != null) winner = hp > ap ? "home" : "away";
    }
    if (!winner) { draws++; return; }
    const leftWon = (winner === "home" && homeIsLeft) || (winner === "away" && !homeIsLeft);
    if (leftWon) leftWins++; else rightWins++;
  });

  // Points comparison
  const leftPts  = ALL_TEAMS.filter(t => t.person === h2hLeft).reduce((s,t)  => s+(POINTS[teamStatus[t.team]]||0), 0);
  const rightPts = ALL_TEAMS.filter(t => t.person === h2hRight).reduce((s,t) => s+(POINTS[teamStatus[t.team]]||0), 0);
  const leftAlive  = ALL_TEAMS.filter(t => t.person === h2hLeft  && teamStatus[t.team] !== "elim").length;
  const rightAlive = ALL_TEAMS.filter(t => t.person === h2hRight && teamStatus[t.team] !== "elim").length;

  const totalClash = leftWins + rightWins + draws;
  let resultLabel = "", resultCls = "";
  if (totalClash === 0) { resultLabel = "No clashes yet"; resultCls = "h2h-draw"; }
  else if (leftWins > rightWins) { resultLabel = `${h2hLeft} leads`; resultCls = "h2h-win"; }
  else if (rightWins > leftWins) { resultLabel = `${h2hRight} leads`; resultCls = "h2h-lose"; }
  else { resultLabel = "Even"; resultCls = "h2h-draw"; }

  // People selector
  const opts = PEOPLE.map(p => `<option value="${p.name}" ${p.name===h2hLeft?"selected":""}>${p.name}${p.note?' ('+p.note+')':''}</option>`).join("");
  const opts2 = PEOPLE.map(p => `<option value="${p.name}" ${p.name===h2hRight?"selected":""}>${p.name}${p.note?' ('+p.note+')':''}</option>`).join("");

  let h = `<div class="h2h-selectors">
    <select class="h2h-select" onchange="setH2H('left',this.value)">${opts}</select>
    <span class="h2h-vs">vs</span>
    <select class="h2h-select" onchange="setH2H('right',this.value)">${opts2}</select>
  </div>`;

  // Banner
  h += `<div class="h2h-banner">
    <div class="h2h-side left">
      <div class="h2h-avatar" style="background:${pLeft.bg};color:${pLeft.color}">${initials(pLeft.name)}</div>
      <div class="h2h-pname">${pLeft.name}</div>
      ${pLeft.note ? `<div class="h2h-psub">${pLeft.note}</div>` : ''}
      <div class="h2h-big" style="color:${pLeft.color}">${leftWins}</div>
      <div style="font-size:11px;color:var(--text-muted)">clash wins</div>
      <div style="font-size:13px;margin-top:8px;font-weight:500">${leftPts} pts · ${leftAlive} alive</div>
    </div>
    <div class="h2h-mid">
      <span class="h2h-result ${resultCls}">${resultLabel}</span>
      ${draws > 0 ? `<div class="h2h-mid-score">${draws} draw${draws!==1?'s':''}</div>` : ''}
      <div class="h2h-mid-score" style="margin-top:8px">${totalClash} clash${totalClash!==1?'es':''}</div>
    </div>
    <div class="h2h-side">
      <div class="h2h-avatar" style="background:${pRight.bg};color:${pRight.color}">${initials(pRight.name)}</div>
      <div class="h2h-pname">${pRight.name}</div>
      ${pRight.note ? `<div class="h2h-psub">${pRight.note}</div>` : ''}
      <div class="h2h-big" style="color:${pRight.color}">${rightWins}</div>
      <div style="font-size:11px;color:var(--text-muted)">clash wins</div>
      <div style="font-size:13px;margin-top:8px;font-weight:500">${rightPts} pts · ${rightAlive} alive</div>
    </div>
  </div>`;

  // Clash matches
  if (clashes.length === 0) {
    h += `<div class="h2h-empty">
      <div style="font-size:32px;margin-bottom:8px">⚽</div>
      No matches scheduled between ${h2hLeft}'s and ${h2hRight}'s teams yet.<br>
      <span style="font-size:12px">Check back once the group stage draws are finalized.</span>
    </div>`;
  } else {
    const finished = clashes.filter(c => c.m.status === "FINISHED");
    const pending  = clashes.filter(c => c.m.status !== "FINISHED");

    if (finished.length > 0) {
      h += `<div class="h2h-section-title">Played matches</div><div class="h2h-matches">`;
      finished.forEach(({m, home, away, homeIsLeft}) => {
        const hs  = m.score?.fullTime?.home ?? m.score?.fullTime?.homeTeam ?? 0;
        const as2 = m.score?.fullTime?.away ?? m.score?.fullTime?.awayTeam ?? 0;
        const hp  = m.score?.penalties?.home ?? m.score?.penalties?.homeTeam;
        const ap  = m.score?.penalties?.away ?? m.score?.penalties?.awayTeam;
        let winner = null;
        if (hs > as2) winner = "home";
        else if (as2 > hs) winner = "away";
        else if (hp != null && ap != null) winner = hp > ap ? "home" : "away";
        const leftWon  = winner && ((winner==="home" && homeIsLeft) || (winner==="away" && !homeIsLeft));
        const rightWon = winner && !leftWon;
        const rowCls   = !winner ? "draw" : leftWon ? "left-win" : "right-win";
        const stageStr = (STATUSES.find(s2 => API_STAGE_MAP[m.stage] === s2.key) || {label: m.stage||""}).label;
        const penStr   = hp != null ? ` (${hp}–${ap} pens)` : "";
        const leftTeam  = homeIsLeft ? home : away;
        const rightTeam = homeIsLeft ? away : home;
        const leftScore  = homeIsLeft ? hs : as2;
        const rightScore = homeIsLeft ? as2 : hs;
        h += `<div class="h2h-match ${rowCls}">
          <div class="h2h-match-teams">
            <span style="color:${pLeft.color};font-weight:500">${FLAGS[leftTeam]||""} ${leftTeam}</span>
            <span class="h2h-match-score" style="color:${leftWon?pLeft.color:rightWon?pRight.color:'var(--text-muted)'}">${leftScore} – ${rightScore}${penStr}</span>
            <span style="color:${pRight.color};font-weight:500">${FLAGS[rightTeam]||""} ${rightTeam}</span>
          </div>
          <div class="h2h-match-stage">${stageStr}</div>
        </div>`;
      });
      h += `</div>`;
    }

    if (pending.length > 0) {
      h += `<div class="h2h-section-title">Upcoming clashes</div><div class="h2h-matches">`;
      pending.forEach(({m, home, away, homeIsLeft}) => {
        const kickoff = m.utcDate ? new Date(m.utcDate).toLocaleDateString([], {month:'short',day:'numeric'}) + " · " + new Date(m.utcDate).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : "TBD";
        const leftTeam  = homeIsLeft ? home : away;
        const rightTeam = homeIsLeft ? away : home;
        h += `<div class="h2h-match pending">
          <div class="h2h-match-teams">
            <span style="color:${pLeft.color};font-weight:500">${FLAGS[leftTeam]||""} ${leftTeam}</span>
            <span class="h2h-match-score" style="color:var(--text-muted)">vs</span>
            <span style="color:${pRight.color};font-weight:500">${FLAGS[rightTeam]||""} ${rightTeam}</span>
          </div>
          <div class="h2h-match-stage">${kickoff}</div>
        </div>`;
      });
      h += `</div>`;
    }
  }

  el.innerHTML = h;
}

function setH2H(side, val) {
  if (side === "left") h2hLeft = val;
  else h2hRight = val;
  renderH2H();
}
window.setH2H = setH2H;

function renderAll() { renderLeaderboard(); renderTeams(); renderScoring(); renderH2H(); renderLiveScores(); }

function showTab(name, btn) {
  ["leaderboard","live","h2h","teams","scoring"].forEach(t => {
    document.getElementById("tab-"+t).style.display = t===name?"block":"none";
  });
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
}

function setMode(m) { scoreMode = m; renderLeaderboard(); }

window.showTab = showTab;
window.setMode = setMode;
window.fetchScores = fetchScores;
window.toggleExpand = toggleExpand;

renderAll();
fetchScores();
setInterval(fetchScores, 5 * 60 * 1000);
</script>
</body>
</html>
