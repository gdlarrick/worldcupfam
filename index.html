<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Family Pool</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #3B6D11; --green-light: #EAF3DE; --green-dark: #27500A;
  --blue: #185FA5; --blue-light: #E6F1FB;
  --purple: #534AB7; --purple-light: #EEEDFE;
  --amber: #BA7517; --amber-light: #FAEEDA;
  --coral: #993C1D; --coral-light: #FAECE7;
  --pink: #72243E; --pink-light: #FBEAF0;
  --gray: #5F5E5A; --gray-light: #F1EFE8;
  --border: #e2e2e2; --bg: #f7f7f5; --bg-card: #ffffff;
  --text: #1a1a18; --text-muted: #6b6b67; --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --border: #2e2e2c; --bg: #1a1a18; --bg-card: #242422;
    --text: #f0f0ec; --text-muted: #9a9a94;
    --green-light: #1a3608; --green-dark: #C0DD97;
    --blue-light: #0C447C; --purple-light: #3C3489;
    --amber-light: #412402; --coral-light: #4A1B0C;
    --pink-light: #4B1528; --gray-light: #2C2C2A;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
header { margin-bottom: 20px; }
header h1 { font-size: 22px; font-weight: 600; }
header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.prizes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.prize-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
.prize-1 { background: #FAEEDA; color: #633806; }
.prize-2 { background: #F1EFE8; color: #444441; }
.prize-3 { background: var(--coral-light); color: var(--coral); }
.sync-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 10px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
.sync-dot.ok { background: #639922; }
.sync-dot.loading { background: #BA7517; animation: pulse 1s infinite; }
.sync-dot.err { background: #E24B4A; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab { font-size: 14px; padding: 8px 16px; background: none; border: none; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; white-space: nowrap; }
.tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }
.mode-toggle { display: flex; gap: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 16px; width: fit-content; }
.mode-btn { font-size: 13px; padding: 7px 16px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-family: inherit; }
.mode-btn.active { background: var(--text); color: var(--bg); font-weight: 500; }
.leaderboard { display: flex; flex-direction: column; gap: 8px; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); transition: opacity .2s; }
.lb-row.first { border: 2px solid #EF9F27; }
.lb-row.second { border: 2px solid #aaaaaa; }
.lb-row.third { border: 2px solid #cd7f32; }
.lb-row.eliminated { opacity: .5; }
.lb-pos { font-size: 16px; font-weight: 600; width: 32px; text-align: center; flex-shrink: 0; color: var(--text-muted); }
.lb-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.lb-info { flex: 1; min-width: 0; }
.lb-name { font-size: 15px; font-weight: 500; }
.lb-picks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.pick { font-size: 11px; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.s-group { background: var(--green-light); color: var(--green-dark); }
.s-elim  { background: var(--gray-light); color: var(--gray); text-decoration: line-through; opacity: .65; }
.s-r16   { background: var(--blue-light); color: var(--blue); }
.s-qf    { background: var(--purple-light); color: var(--purple); }
.s-sf    { background: var(--amber-light); color: var(--amber); }
.s-final { background: var(--pink-light); color: var(--pink); }
.s-won   { background: var(--green-light); color: var(--green); font-weight: 600; }
.lb-score { text-align: right; flex-shrink: 0; min-width: 60px; }
.score-n { font-size: 24px; font-weight: 600; }
.score-sub { font-size: 11px; color: var(--text-muted); }
.last-standing-info { background: var(--amber-light); border: 1px solid #EF9F27; border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: var(--amber); margin-bottom: 16px; line-height: 1.6; }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 6px; }
.team-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.team-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.team-row:last-child { border-bottom: none; }
.t-flag { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.t-name { flex: 1; font-size: 13px; }
.t-owner { font-size: 11px; }
.t-select { font-size: 12px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; font-family: inherit; }
.save-area { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-save { font-size: 14px; padding: 9px 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--text); color: var(--bg); cursor: pointer; font-family: inherit; font-weight: 500; }
.btn-save:hover { opacity: .85; }
.btn-save:disabled { opacity: .45; cursor: default; }
.save-msg { font-size: 13px; color: var(--text-muted); }
.setup-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.setup-box h2 { font-size: 16px; font-weight: 500; margin-bottom: 10px; }
.setup-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.6; }
.setup-box input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--bg); color: var(--text); font-family: inherit; margin-bottom: 10px; }
.setup-box a { color: var(--blue); }
.scoring-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
.scoring-card h3 { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
.scoring-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
.scoring-card td { padding: 6px 0; border-bottom: 1px solid var(--border); }
.scoring-card tr:last-child td { border-bottom: none; }
.scoring-card td:last-child { text-align: right; font-weight: 500; }
.note { font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; }
.divider { height: 1px; background: var(--border); margin: 20px 0; }
.out-label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; background: var(--gray-light); color: var(--gray); }
@media(max-width:520px) {
  .lb-row { flex-wrap: wrap; }
  .lb-score { width: 100%; text-align: left; display: flex; align-items: baseline; gap: 8px; padding-top: 4px; }
  .mode-toggle { width: 100%; }
  .mode-btn { flex: 1; text-align: center; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚽ World Cup 2026 — Family Pool</h1>
    <p>June 11 – July 19 &nbsp;·&nbsp; 10 players &nbsp;·&nbsp; 49 picks &nbsp;·&nbsp; $2/team entry</p>
    <div class="prizes">
      <span class="prize-badge prize-1">🥇 1st place — $50</span>
      <span class="prize-badge prize-2">🥈 2nd place — $30</span>
      <span class="prize-badge prize-3">🥉 3rd place — $16</span>
    </div>
    <div class="sync-bar">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncMsg">Connecting…</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('leaderboard',this)">Leaderboard</button>
    <button class="tab" onclick="showTab('update',this)">Update results</button>
    <button class="tab" onclick="showTab('scoring',this)">Scoring</button>
    <button class="tab" onclick="showTab('setup',this)">Setup</button>
  </div>

  <div id="tab-leaderboard"></div>
  <div id="tab-update" style="display:none"></div>
  <div id="tab-scoring" style="display:none"></div>
  <div id="tab-setup" style="display:none"></div>
</div>

<script>
const PEOPLE = [
  {name:"Steve",    color:"#185FA5", bg:"#dbeafe", note:""},
  {name:"AG",       color:"#0F6E56", bg:"#d1fae5", note:"👵 Nana"},
  {name:"Bob",      color:"#993C1D", bg:"#fee2d5", note:""},
  {name:"Gretchen", color:"#534AB7", bg:"#ede9fe", note:""},
  {name:"Simon",    color:"#854F0B", bg:"#fef3c7", note:""},
  {name:"Juliet",   color:"#993556", bg:"#fce7f3", note:""},
  {name:"River",    color:"#3B6D11", bg:"#dcfce7", note:""},
  {name:"Scott",    color:"#5F5E5A", bg:"#f3f4f6", note:""},
  {name:"Alden",    color:"#0C447C", bg:"#dbeafe", note:""},
  {name:"Michael",  color:"#712B13", bg:"#fee2d5", note:""},
];

const DRAFT = [
  {person:"Steve",    teams:["South Korea","Tunisia","Haiti","Norway"]},
  {person:"AG",       teams:["Uzbekistan","Algeria","Colombia","Portugal"]},
  {person:"Bob",      teams:["Qatar","Senegal","Ecuador","Spain","Croatia"]},
  {person:"Gretchen", teams:["Iraq","Ghana","Mexico","Scotland","Belgium"]},
  {person:"Simon",    teams:["Japan","South Africa","Argentina","Germany","Uruguay"]},
  {person:"Juliet",   teams:["Iran","Democratic Republic of Congo","Canada","Switzerland","Paraguay"]},
  {person:"River",    teams:["Jordan","Egypt","Brazil","Turkey","Bosnia and Herzegovina"]},
  {person:"Scott",    teams:["Australia","Ivory Coast","United States","Netherlands","Czech Republic"]},
  {person:"Alden",    teams:["New Zealand","Morocco","Curacao","Sweden","England"]},
  {person:"Michael",  teams:["Saudi Arabia","Cape Verde","Panama","France","Austria"]},
];

const ALL_TEAMS = [];
DRAFT.forEach(d => d.teams.forEach(t => ALL_TEAMS.push({team:t, person:d.person})));

const FLAGS = {
  "South Korea":"🇰🇷","Tunisia":"🇹🇳","Haiti":"🇭🇹","Norway":"🇳🇴",
  "Uzbekistan":"🇺🇿","Algeria":"🇩🇿","Colombia":"🇨🇴","Portugal":"🇵🇹",
  "Qatar":"🇶🇦","Senegal":"🇸🇳","Ecuador":"🇪🇨","Spain":"🇪🇸","Croatia":"🇭🇷",
  "Iraq":"🇮🇶","Ghana":"🇬🇭","Mexico":"🇲🇽","Scotland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Belgium":"🇧🇪",
  "Japan":"🇯🇵","South Africa":"🇿🇦","Argentina":"🇦🇷","Germany":"🇩🇪","Uruguay":"🇺🇾",
  "Iran":"🇮🇷","Democratic Republic of Congo":"🇨🇩","Canada":"🇨🇦","Switzerland":"🇨🇭","Paraguay":"🇵🇾",
  "Jordan":"🇯🇴","Egypt":"🇪🇬","Brazil":"🇧🇷","Turkey":"🇹🇷","Bosnia and Herzegovina":"🇧🇦",
  "Australia":"🇦🇺","Ivory Coast":"🇨🇮","United States":"🇺🇸","Netherlands":"🇳🇱","Czech Republic":"🇨🇿",
  "New Zealand":"🇳🇿","Morocco":"🇲🇦","Curacao":"🇨🇼","Sweden":"🇸🇪","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿",
  "Saudi Arabia":"🇸🇦","Cape Verde":"🇨🇻","Panama":"🇵🇦","France":"🇫🇷","Austria":"🇦🇹",
};

const CONFS = [
  {label:"AFC / OFC", teams:["South Korea","Uzbekistan","Qatar","Iraq","Japan","Iran","Jordan","Australia","New Zealand","Saudi Arabia"]},
  {label:"CAF", teams:["Tunisia","Algeria","Senegal","Ghana","South Africa","Democratic Republic of Congo","Egypt","Ivory Coast","Morocco","Cape Verde"]},
  {label:"CONCACAF / CONMEBOL", teams:["Haiti","Colombia","Ecuador","Mexico","Argentina","Canada","Brazil","United States","Curacao","Panama"]},
  {label:"UEFA", teams:["Norway","Portugal","Spain","Scotland","Germany","Switzerland","Turkey","Netherlands","Sweden","France"]},
  {label:"CONMEBOL / UEFA (5th pick)", teams:["Croatia","Belgium","Uruguay","Paraguay","Bosnia and Herzegovina","Czech Republic","England","Austria"]},
];

const STATUSES = [
  {key:"group", label:"Group stage",  pts:0},
  {key:"elim",  label:"Eliminated",   pts:0},
  {key:"r16",   label:"Round of 16",  pts:2},
  {key:"qf",    label:"Quarterfinal", pts:4},
  {key:"sf",    label:"Semifinal",    pts:8},
  {key:"final", label:"Final",        pts:12},
  {key:"won",   label:"Champion 🏆",  pts:20},
];

const STAGE_ORDER = ["group","elim","r16","qf","sf","final","won"];
const POINTS = Object.fromEntries(STATUSES.map(s=>[s.key,s.pts]));

let teamStatus = {};
ALL_TEAMS.forEach(t => teamStatus[t.team] = "group");

let BIN_ID = localStorage.getItem("wc2026_bin_id") || "";
let API_KEY = localStorage.getItem("wc2026_api_key") || "";
let saveMsg = "";
let isSaving = false;
let currentTab = "leaderboard";
let scoreMode = "points";

function setSyncState(state, msg) {
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncMsg");
  if (!dot) return;
  dot.className = "sync-dot " + state;
  txt.textContent = msg;
}

async function loadData() {
  if (!BIN_ID || !API_KEY) { setSyncState("err","Not configured — see Setup tab"); renderAll(); return; }
  setSyncState("loading","Loading…");
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{"X-Master-Key":API_KEY}});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (d.record && d.record.teamStatus) Object.assign(teamStatus, d.record.teamStatus);
    const ts = d.record?.updatedAt ? new Date(d.record.updatedAt).toLocaleString() : "";
    setSyncState("ok","Live" + (ts ? " · updated " + ts : ""));
  } catch(e) { setSyncState("err","Could not load — check Setup"); }
  renderAll();
}

async function saveData() {
  if (!BIN_ID || !API_KEY) { alert("Configure JSONBin first in the Setup tab."); return; }
  isSaving = true;
  setSyncState("loading","Saving…");
  renderUpdate();
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},
      body:JSON.stringify({teamStatus, updatedAt:new Date().toISOString()})
    });
    if (!r.ok) throw new Error(r.status);
    setSyncState("ok","Saved · " + new Date().toLocaleTimeString());
    saveMsg = "✓ Saved! Everyone will see the updated standings.";
  } catch(e) { setSyncState("err","Save failed"); saveMsg = "⚠ Save failed — check your API key."; }
  isSaving = false;
  renderAll();
  setTimeout(()=>{ saveMsg=""; renderUpdate(); },4000);
}

function sCls(s) {
  const map = {group:"s-group",elim:"s-elim",r16:"s-r16",qf:"s-qf",sf:"s-sf",final:"s-final",won:"s-won"};
  return map[s]||"s-group";
}
function sLabel(s) { return (STATUSES.find(x=>x.key===s)||STATUSES[0]).label; }
function initials(n) { return n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase(); }

function bestStage(teams) {
  let best = "elim";
  teams.forEach(t => {
    const ts = teamStatus[t.team]||"group";
    if (STAGE_ORDER.indexOf(ts) > STAGE_ORDER.indexOf(best)) best = ts;
  });
  return best;
}

function calcPointsScores() {
  return PEOPLE.map(p => {
    const myTeams = ALL_TEAMS.filter(t => t.person === p.name);
    const pts = myTeams.reduce((s,t) => s+(POINTS[teamStatus[t.team]]||0), 0);
    const alive = myTeams.filter(t => teamStatus[t.team] !== "elim").length;
    return {...p, pts, alive, myTeams, sortKey: pts * 1000 + alive};
  }).sort((a,b) => b.sortKey - a.sortKey);
}

function calcLastStandingScores() {
  return PEOPLE.map(p => {
    const myTeams = ALL_TEAMS.filter(t => t.person === p.name);
    const aliveTeams = myTeams.filter(t => !["elim"].includes(teamStatus[t.team]));
    const alive = aliveTeams.length;
    const best = bestStage(myTeams);
    const bestIdx = STAGE_ORDER.indexOf(best);
    const isOut = alive === 0;
    return {...p, alive, best, bestIdx, isOut, myTeams, sortKey: isOut ? -1 : bestIdx * 100 + alive};
  }).sort((a,b) => b.sortKey - a.sortKey);
}

function renderLeaderboard() {
  const isPoints = scoreMode === "points";
  const scores = isPoints ? calcPointsScores() : calcLastStandingScores();

  let h = `<div class="mode-toggle">
    <button class="mode-btn ${isPoints?'active':''}" onclick="setMode('points')">Points</button>
    <button class="mode-btn ${!isPoints?'active':''}" onclick="setMode('last')">Last standing</button>
  </div>`;

  if (!isPoints) {
    h += `<div class="last-standing-info">
      <strong>Last standing mode</strong> — whoever still has at least one team alive wins. If multiple people are still in, whoever has a team at the furthest stage ranks higher. When all your teams are out, you're eliminated from the prize.
    </div>`;
  }

  h += `<div class="leaderboard">`;

  let posCounter = 0;
  let prevSortKey = null;

  scores.forEach((p, i) => {
    if (p.sortKey !== prevSortKey) posCounter = i + 1;
    prevSortKey = p.sortKey;

    let posLabel = posCounter;
    let rowClass = "";
    if (!isPoints && p.isOut) { posLabel = "❌"; rowClass = "eliminated"; }
    else if (posCounter === 1) { rowClass = "first"; posLabel = "🥇"; }
    else if (posCounter === 2) { rowClass = "second"; posLabel = "🥈"; }
    else if (posCounter === 3) { rowClass = "third"; posLabel = "🥉"; }

    const picks = p.myTeams.map(t => {
      const s = teamStatus[t.team]||"group";
      return `<span class="pick ${sCls(s)}">${FLAGS[t.team]||""} ${t.team}</span>`;
    }).join("");

    const nameExtra = p.note ? ` <span style="font-size:12px;color:var(--text-muted)">${p.note}</span>` : "";

    let scoreHtml = "";
    if (isPoints) {
      scoreHtml = `<div class="score-n">${p.pts}</div><div class="score-sub">pts · ${p.alive} alive</div>`;
    } else {
      if (p.isOut) {
        scoreHtml = `<div class="score-n" style="font-size:14px;color:var(--text-muted)">Out</div><div class="score-sub">all eliminated</div>`;
      } else {
        scoreHtml = `<div class="score-n">${p.alive}</div><div class="score-sub">team${p.alive!==1?'s':''} alive · best: ${sLabel(p.best)}</div>`;
      }
    }

    h += `<div class="lb-row ${rowClass}">
      <div class="lb-pos">${posLabel}</div>
      <div class="lb-avatar" style="background:${p.bg};color:${p.color}">${initials(p.name)}</div>
      <div class="lb-info">
        <div class="lb-name">${p.name}${nameExtra}</div>
        <div class="lb-picks">${picks}</div>
      </div>
      <div class="lb-score">${scoreHtml}</div>
    </div>`;
  });

  h += `</div>`;
  document.getElementById("tab-leaderboard").innerHTML = h;
}

function renderUpdate() {
  let h = `<p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Update each team's furthest stage reached. Save when done — leaderboard updates for everyone.</p>`;
  CONFS.forEach(conf => {
    h += `<div class="section-title">${conf.label}</div><div class="team-list">`;
    conf.teams.forEach(team => {
      const owner = ALL_TEAMS.find(t=>t.team===team)?.person||"";
      const p = PEOPLE.find(x=>x.name===owner);
      const s = teamStatus[team]||"group";
      const opts = STATUSES.map(st=>`<option value="${st.key}" ${s===st.key?"selected":""}>${st.label}${st.pts>0?' (+'+st.pts+'pts)':''}</option>`).join("");
      h += `<div class="team-row">
        <div class="t-flag">${FLAGS[team]||"🏳"}</div>
        <div class="t-name">${team}<br><span class="t-owner" style="color:${p?p.color:"var(--text-muted)"}">${owner}${p&&p.note?' · '+p.note:''}</span></div>
        <select class="t-select" onchange="updateTeam('${team.replace(/'/g,"\\'")}',this.value)">${opts}</select>
      </div>`;
    });
    h += `</div>`;
  });
  h += `<div class="save-area">
    <button class="btn-save" onclick="saveData()" ${isSaving?"disabled":""}>Save for everyone</button>
    <span class="save-msg">${saveMsg}</span>
  </div>`;
  document.getElementById("tab-update").innerHTML = h;
}

function renderScoring() {
  document.getElementById("tab-scoring").innerHTML = `
  <div class="scoring-card">
    <h3>Points mode — cumulative</h3>
    <table>
      <tr><td>Group stage</td><td>0 pts</td></tr>
      <tr><td>Eliminated</td><td>0 pts</td></tr>
      <tr><td>Round of 16</td><td>+2 pts per team</td></tr>
      <tr><td>Quarterfinal</td><td>+4 pts per team</td></tr>
      <tr><td>Semifinal</td><td>+8 pts per team</td></tr>
      <tr><td>Final</td><td>+12 pts per team</td></tr>
      <tr><td>Champion 🏆</td><td>+20 pts per team</td></tr>
    </table>
    <p class="note">Points are cumulative — a team reaching the SF earns 14 pts total (2+4+8). Your score is the sum across all your picked teams. 1st, 2nd and 3rd place by total points win prizes.</p>
  </div>
  <div class="divider"></div>
  <div class="scoring-card">
    <h3>Last standing mode — survival</h3>
    <table>
      <tr><td>Have at least one team still in</td><td>Still alive</td></tr>
      <tr><td>All your teams eliminated</td><td>Out ❌</td></tr>
      <tr><td>Tiebreaker</td><td>Furthest stage reached</td></tr>
      <tr><td>Second tiebreaker</td><td>Most teams still alive</td></tr>
    </table>
    <p class="note">Think of it like a last-man-standing pool. The last person with a team still playing wins. If multiple people are in the same round, whoever has a team at the furthest stage ranks higher. Prize goes to whoever outlasts everyone else — or whoever's team wins the cup.</p>
  </div>
  <div class="divider"></div>
  <div class="scoring-card" style="background:var(--amber-light);border-color:#EF9F27">
    <h3 style="color:var(--amber)">Prize breakdown (from original rules)</h3>
    <table>
      <tr><td>1st place</td><td style="color:var(--amber)">$50</td></tr>
      <tr><td>2nd place</td><td style="color:var(--amber)">$30</td></tr>
      <tr><td>3rd place</td><td style="color:var(--amber)">$16</td></tr>
      <tr><td>Entry</td><td style="color:var(--amber)">$2 per team picked</td></tr>
    </table>
    <p class="note" style="color:var(--amber)">Steve and AG drew 4 teams each. Everyone else drew 5.</p>
  </div>`;
}

function renderSetup() {
  document.getElementById("tab-setup").innerHTML = `
  <div class="setup-box">
    <h2>Connect to JSONBin (free live sync)</h2>
    <p>JSONBin stores scores online so everyone sees live updates. Takes about 2 minutes.</p>
    <p><strong>Step 1:</strong> Go to <a href="https://jsonbin.io" target="_blank">jsonbin.io</a> → sign up free → Dashboard → API Keys → copy your <strong>Master Key</strong>.</p>
    <p><strong>Step 2:</strong> Click "Create Bin" → paste this as the content: <code style="font-size:11px;background:var(--bg);padding:2px 6px;border-radius:4px">{"teamStatus":{}}</code> → Save. Copy the <strong>Bin ID</strong> from the URL.</p>
    <p><strong>Step 3:</strong> Paste both below and click Save settings.</p>
    <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">Master Key (starts with $2a…)</label>
    <input type="password" id="inp-key" placeholder="$2a$10$..." value="${API_KEY}">
    <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">Bin ID (24 character string)</label>
    <input type="text" id="inp-bin" placeholder="64abc123def456..." value="${BIN_ID}">
    <button class="btn-save" onclick="saveSettings()">Save settings &amp; connect</button>
    <p class="note" style="margin-top:14px">Keys are saved in your browser only. To skip the setup step for everyone, open index.html in a text editor and replace the two <code>localStorage.getItem</code> lines with your actual values hardcoded.</p>
  </div>`;
}

function renderAll() {
  renderLeaderboard();
  renderUpdate();
  renderScoring();
  renderSetup();
}

function showTab(name, btn) {
  currentTab = name;
  ["leaderboard","update","scoring","setup"].forEach(t => {
    document.getElementById("tab-"+t).style.display = t===name?"block":"none";
  });
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
}

function setMode(m) {
  scoreMode = m;
  renderLeaderboard();
}

function updateTeam(team, val) {
  teamStatus[team] = val;
  renderLeaderboard();
}

function saveSettings() {
  BIN_ID = document.getElementById("inp-bin").value.trim();
  API_KEY = document.getElementById("inp-key").value.trim();
  localStorage.setItem("wc2026_bin_id", BIN_ID);
  localStorage.setItem("wc2026_api_key", API_KEY);
  loadData();
}

window.showTab = showTab;
window.setMode = setMode;
window.updateTeam = updateTeam;
window.saveData = saveData;
window.saveSettings = saveSettings;

renderAll();
loadData();
setInterval(() => { if (currentTab === "leaderboard") loadData(); }, 60000);
</script>
</body>
</html>
